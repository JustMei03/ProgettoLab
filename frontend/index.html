<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rilevatore di sarcasmo</title>
  </head>
  <body>
    <h1>Rilevatore di sarcasmo</h1>

    <div id="chat">
      <p id="empty-state">Scrivi un messaggio per iniziare.</p>
    </div>

    <form id="composer">
      <input id="message" placeholder="Scrivi un messaggio…" autocomplete="off" />
      <button id="send" type="submit">Invia</button>
    </form>

    <script type="module" src="app.js"></script>
  </body>
</html>
