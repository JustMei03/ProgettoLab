<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f2" />
    <title>Il mio progetto linguistico</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20231f;
        background: #f5f5f2;
      }

      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; }
      button, input { font: inherit; }
      .page {
        width: min(100% - 32px, 720px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 48px 0 24px;
        display: flex;
        flex-direction: column;
      }
      .header { margin-bottom: 28px; }
      .eyebrow, .hint { color: #73776f; font-size: 0.78rem; }
      .eyebrow { letter-spacing: 0.06em; }
      h1 { margin: 8px 0; font-size: clamp(2rem, 7vw, 3rem); }
      .subtitle { margin: 0; color: #5e625a; }
      .chat {
        flex: 1;
        min-height: 280px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border: 1px solid #dedfd8;
        border-radius: 20px;
        background: #fff;
      }
      .empty-state { margin: auto; color: #73776f; text-align: center; }
      .message {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 16px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .user {
        align-self: flex-end;
        color: #fff;
        background: #365f4b;
        border-bottom-right-radius: 4px;
      }
      .assistant {
        align-self: flex-start;
        background: #f0f1ec;
        border-bottom-left-radius: 4px;
      }
      .error {
        align-self: center;
        color: #9c2f2f;
        background: #fff0ef;
      }
      .composer { display: flex; gap: 10px; margin-top: 16px; }
      .composer input {
        min-width: 0;
        flex: 1;
        padding: 13px 16px;
        border: 1px solid #cfd1c9;
        border-radius: 999px;
        background: #fff;
      }
      .composer button {
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        color: #fff;
        background: #365f4b;
        cursor: pointer;
      }
      .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
      .composer input:focus-visible, .composer button:focus-visible {
        outline: 3px solid #9ab8a6;
        outline-offset: 2px;
      }
      .hint { margin: 12px 4px 0; letter-spacing: normal; }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="eyebrow">LABORATORIO DI INTERFACCE LINGUISTICHE</p>
        <h1>Il mio progetto</h1>
        <p class="subtitle">Personalizza questa chat e il comportamento del backend.</p>
      </header>

      <section id="chat" class="chat" aria-label="Conversazione" aria-live="polite">
        <p id="empty-state" class="empty-state">Scrivi un messaggio per provare il tuo progetto.</p>
      </section>

      <form id="composer" class="composer">
        <label for="message" hidden>Il tuo messaggio</label>
        <input id="message" autocomplete="off" placeholder="Scrivi un messaggio…" />
        <button id="send" type="submit">Invia</button>
      </form>
      <p class="hint">La risposta segnaposto si modifica in <code>backend/main.py</code>.</p>
    </main>

    <script>
      const chat = document.querySelector("#chat");
      const form = document.querySelector("#composer");
      const input = document.querySelector("#message");
      const sendButton = document.querySelector("#send");

      function addMessage(role, text) {
        document.querySelector("#empty-state")?.remove();
        const message = document.createElement("div");
        message.className = `message ${role}`;
        message.textContent = text;
        chat.append(message);
        message.scrollIntoView({ block: "nearest" });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || sendButton.disabled) return;

        addMessage("user", message);
        input.value = "";
        sendButton.disabled = true;

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || `Errore del backend (${response.status})`);
          }
          addMessage("assistant", data.response);
        } catch (error) {
          addMessage("error", error instanceof Error ? error.message : "Errore imprevisto.");
        } finally {
          sendButton.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
